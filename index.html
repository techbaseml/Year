<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EARTH: AFTERLIGHT</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<canvas id="game"></canvas>
<div class="load-sub">EARTH RECOVERY NETWORK / OFFLINE 3D BUILD</div>
  <div class="load-bar"><i id="loadFill"></i></div>
  <button id="start" disabled>INITIALIZING...</button>
</div>

<div id="hud">
  <div class="top glass">
    <div>
      <div class="tiny">EARTH RECOVERY NETWORK</div>
      <div id="zone">SILENT CITY</div>
    </div>
    <div class="stats">
      <span>ENERGY <b id="energy">100</b>%</span>
      <span>CREDITS <b id="credits">0.00</b></span>
      <span>YEAR <b>2380</b></span>
    </div>
  </div>
  <div id="message" class="message glass">WASD to move · click to capture mouse · E scan · R recover</div>
  <div id="scan" class="glass scan hidden">
    <div class="tiny">OBJECT SCAN</div>
    <h3 id="scanName">—</h3>
    <div id="scanValue">VALUE —</div>
    <p id="scanInfo">—</p>
  </div>
  <div class="bottom">
    <div class="hint glass">WASD MOVE · SHIFT SPRINT · MOUSE LOOK · E SCAN · R RECOVER</div>
    <button id="returnBtn" disabled>RETURN SIGNAL LOCKED</button>
  </div>
</div>

<div id="story" class="story hidden">
  <div class="story-card glass">
    <div class="tiny">DEEP EARTH SIGNAL</div>
    <h1 id="storyTitle">THE RETURN</h1>
    <p id="storyText"></p>
    <button id="storyBtn">CONTINUE</button>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
